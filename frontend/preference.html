<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripTailor Preference</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-page">
    <div class="app-phone preference-phone">
      <header class="top-profile">
        <div></div>
        <div class="profile-info">
          <div class="profile-icon"><i class="fa-regular fa-user"></i></div>
          <span id="preference-user-name">User</span>
        </div>
      </header>

      <main class="preference-content">
        <section class="preference-title-row">
          <button class="page-back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
          <div>
            <h3>Travel Preference</h3>
            <p>Help TripTailor recommend places for you.</p>
          </div>
        </section>

        <form class="preference-form">
          <label>Budget
            <select id="budget-input">
              <option value="">Select budget</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </label>

          <label>Preferred Transportation
            <select id="transport-input">
              <option value="">Select transportation</option>
              <option value="Walking">Walking</option>
              <option value="Public Transportation">Public Transportation</option>
              <option value="Car">Car</option>
              <option value="Scooter">Scooter</option>
              <option value="Bike">Bike</option>
            </select>
          </label>

          <label>Interest Tag
            <select id="interest-input">
              <option value="">Select interest</option>
              <option value="Nature">Nature</option>
              <option value="Museums">Museums</option>
              <option value="Food">Food</option>
              <option value="Shopping">Shopping</option>
              <option value="History">History</option>
              <option value="View">View</option>
            </select>
          </label>

          <button type="button" class="save-preference-btn">Save Preference</button>
        </form>
      </main>

      <nav class="bottom-nav">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="favorites.html"><i class="fa-regular fa-star"></i></a>
        <a href="profile.html"><i class="fa-regular fa-user"></i></a>
      </nav>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:4000";

    document.addEventListener("DOMContentLoaded", async function () {
      const userId = localStorage.getItem("user_id");
      const userName = localStorage.getItem("user_name") || "User";
      document.getElementById("preference-user-name").textContent = userName;

      if (!userId) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      await loadPreferences(userId);
      document.querySelector(".save-preference-btn").addEventListener("click", async function () {
        await savePreferences(userId);
      });
    });

    async function loadPreferences(userId) {
      try {
        const response = await fetch(`${API_BASE}/api/users/${userId}/preferences`);
        const data = await response.json();

        if (response.status === 404) return;
        if (!response.ok) {
          console.error(data.message || "Failed to load preferences.");
          return;
        }

        document.getElementById("budget-input").value = data.budget || "";
        document.getElementById("transport-input").value = data.prefer_transportation || "";
        document.getElementById("interest-input").value = data.interest_tag || "";
      } catch (error) {
        console.error(error);
      }
    }

    async function savePreferences(userId) {
      const budget = document.getElementById("budget-input").value;
      const preferTransportation = document.getElementById("transport-input").value;
      const interestTag = document.getElementById("interest-input").value;

      if (!budget && !preferTransportation && !interestTag) {
        alert("Please choose at least one preference.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/users/${userId}/preferences`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            budget: budget,
            prefer_transportation: preferTransportation,
            interest_tag: interestTag
          })
        });

        const data = await response.json();
        if (!response.ok) {
          alert(data.message || "Failed to save preferences.");
          return;
        }

        alert("Preference saved!");
        window.location.href = "profile.html";
      } catch (error) {
        console.error(error);
        alert("Cannot connect to backend.");
      }
    }
  </script>
</body>
</html>
