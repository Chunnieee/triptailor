<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripTailor Favorites</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <div class="app-page">
    <div class="app-phone favorites-phone">
      <header class="top-profile">
        <div></div>
        <div class="profile-info">
          <div class="profile-icon"><i class="fa-regular fa-user"></i></div>
          <span id="favorite-user-name">User</span>
        </div>
      </header>

      <main class="favorites-content">
        <section class="favorites-title-row">
          <h3>My Favorites</h3>
          <p>Places you saved for your trip.</p>
        </section>

        <section id="favorites-list" class="favorites-list">
          <p class="loading-text">Loading bookmarks...</p>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="home.html"><i class="fa-solid fa-house"></i></a>
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="favorites.html" class="active"><i class="fa-regular fa-star"></i></a>
        <a href="profile.html"><i class="fa-regular fa-user"></i></a>
      </nav>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:4000";

    document.addEventListener("DOMContentLoaded", async function () {
      const userId = localStorage.getItem("user_id");
      const userName = localStorage.getItem("user_name") || "User";

      document.getElementById("favorite-user-name").textContent = userName;

      if (!userId) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      await loadFavorites(userId);
    });

    async function loadFavorites(userId) {
      const list = document.getElementById("favorites-list");

      try {
        const response = await fetch(`${API_BASE}/api/users/${userId}/favorites`);
        const favorites = await response.json();

        if (!response.ok) {
          list.innerHTML = `<p class="error-text">${favorites.message || "Failed to load favorites."}</p>`;
          return;
        }

        if (!Array.isArray(favorites) || favorites.length === 0) {
          list.innerHTML = `
            <div class="empty-favorites">
              <i class="fa-regular fa-star"></i>
              <h4>No bookmarks yet</h4>
              <p>Save attractions you like and they will appear here.</p>
              <a href="search.html">Find attractions</a>
            </div>
          `;
          return;
        }

        list.innerHTML = favorites.map((item) => {
          const rating = item.google_rating || item.avg_rating || "N/A";
          const city = item.city || "Taiwan";
          const district = item.district || "";
          const address = item.formatted_address || item.description || "";

          return `
            <div class="favorite-card">
              <div class="favorite-main" onclick="goToAttraction(${item.att_id})">
                <h4>${item.att_name}</h4>
                <p>${address}</p>
                <div class="favorite-meta">
                  <span><i class="fa-solid fa-location-dot"></i> ${city} ${district}</span>
                  <span><i class="fa-solid fa-star"></i> ${rating}</span>
                </div>
              </div>
              <button class="remove-favorite-btn" onclick="removeFavorite(event, ${item.favorite_id})">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;
        }).join("");
      } catch (error) {
        console.error(error);
        list.innerHTML = `<p class="error-text">Cannot connect to backend.</p>`;
      }
    }

    async function removeFavorite(event, favoriteId) {
      event.stopPropagation();
      if (!confirm("Remove this bookmark?")) return;

      try {
        const response = await fetch(`${API_BASE}/api/favorites/${favoriteId}`, {
          method: "DELETE"
        });
        const data = await response.json();

        if (!response.ok) {
          alert(data.message || "Failed to remove bookmark.");
          return;
        }

        const userId = localStorage.getItem("user_id");
        await loadFavorites(userId);
      } catch (error) {
        console.error(error);
        alert("Cannot connect to backend.");
      }
    }

    function goToAttraction(attId) {
      window.location.href = `attraction.html?id=${attId}`;
    }
  </script>
</body>
</html>
