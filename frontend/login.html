<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>TripTailor Login</title>
  
  <link rel="stylesheet" href="login.css" />
  <!-- Font Awesome icon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>
  <div class="page">
    <div class="phone">

      <div class="content">

        <!-- Logo icon -->
        <div class="logo-icon">
          ⛰
        </div>

        <h1>TripTailor</h1>

        <!-- 副標題 -->
        <p class="subtitle">Tailor-made trips, just for you.</p>
        
        <!-- Email 輸入區 -->
        <div class="input-group">
          <span class="label">Email Address</span>
          <div class="input-box">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="login-email"
              placeholder=""
            />
          </div>
        </div>

        <!-- Password 輸入區 -->
        <div class="input-group">
          <span class="label">Password</span>
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="login-password"
              placeholder=""
            />
            <i
              class="fa-regular fa-eye icon"
              id="toggle-password">
            </i>
            
          </div>
        </div>

        <!-- Login button -->
        <button type="button" class="login-btn">
          LOG IN
        </button>

        <!-- 註冊提示 -->
        <p class="signup">
          Don’t have an account?
          <a href="register.html">sign up!</a>
        </p>
      </div>

    </div>
  </div>

 <script>
  const API_BASE = "http://localhost:4000";

  const togglePassword = document.getElementById("toggle-password");
  const passwordInput = document.getElementById("login-password");
  const loginBtn = document.querySelector(".login-btn");

  togglePassword.addEventListener("click", function () {
    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      togglePassword.classList.remove("fa-eye");
      togglePassword.classList.add("fa-eye-slash");
    } else {
      passwordInput.type = "password";
      togglePassword.classList.remove("fa-eye-slash");
      togglePassword.classList.add("fa-eye");
    }
  });

  loginBtn.addEventListener("click", async function () {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value.trim();

    if (!email || !password) {
      alert("Please enter email and password.");
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/api/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.message || "Login failed.");
        return;
      }

      localStorage.setItem("user_id", data.user.user_id);
      localStorage.setItem("user_name", data.user.name);
      localStorage.setItem("user_email", data.user.email);
      localStorage.setItem("user_phone", data.user.phone_number || "");
      localStorage.setItem("user_travel_freq", data.user.travel_freq || "");

      window.location.href = "home.html";
    } catch (error) {
      console.error(error);
      alert("Cannot connect to backend. Please make sure backend is running on port 4000.");
    }
  });
</script>

</body>
</html>
