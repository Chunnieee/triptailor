<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TripTailor Search</title>

  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="search.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
  <div class="app-page">
    <div class="app-phone search-phone">
      <header class="top-profile search-profile">

        <!-- Back Button -->
        <button class="back-btn" onclick="history.back()">
          <i class="fa-solid fa-angle-left"></i>
        </button>

        <!-- Profile -->
        <div class="profile-info">
          <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
          </div>

          <span>User</span>
        </div>

      </header>

      <main class="search-content">

        <h3>Where do you want to go?</h3>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="keyword-input" type="text" placeholder="Search keyword" />
        </div>

        <div class="search-box city-search-box">
          <i class="fa-solid fa-location-dot"></i>
          <input id="city-input" type="text" placeholder="City / region, e.g. Taipei" />
        </div>

        <div class="filter-row">
          <i class="fa-solid fa-filter filter-icon"></i>
          <button type="button" data-category="">All</button>
          <button type="button" data-category="Nature">Nature</button>
          <button type="button" data-category="Museums">Museums</button>
          <button type="button" data-category="Food">Food</button>
        </div>

        <div class="big-search-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

      </main>

      <nav class="bottom-nav">
        <a href="home.html">
          <i class="fa-solid fa-house"></i>
        </a>

        <a href="search.html" class="active">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <a href="favorites.html">
          <i class="fa-regular fa-star"></i>
        </a>

        <a href="profile.html">
          <i class="fa-regular fa-user"></i>
        </a>
      </nav>
    </div>
  </div>

  <script>
  const API_BASE = "http://localhost:4000";

  const keywordInput = document.getElementById("keyword-input");
  const cityInput = document.getElementById("city-input");
  const searchContent = document.querySelector(".search-content");
  const filterButtons = document.querySelectorAll(".filter-row button");

  const resultContainer = document.createElement("div");
  resultContainer.className = "search-results";
  searchContent.appendChild(resultContainer);

  const userName = localStorage.getItem("user_name") || "User";
  const profileName = document.querySelector(".profile-info span");
  if (profileName) profileName.textContent = userName;

  keywordInput.addEventListener("keydown", async function (e) {
    if (e.key === "Enter") {
      await searchAttractions();
    }
  });

  cityInput.addEventListener("keydown", async function (e) {
    if (e.key === "Enter") {
      await searchAttractions();
    }
  });

  filterButtons.forEach(function (button) {
    button.addEventListener("click", async function () {
      const category = button.dataset.category || "";
      await searchAttractions(category);
    });
  });

  async function searchAttractions(category = "") {
    const keyword = keywordInput.value.trim();
    const city = cityInput.value.trim();

    if (!keyword && !city && !category) {
      alert("Please enter a keyword, city, or choose a category.");
      return;
    }

    resultContainer.innerHTML = `<p class="loading-text">Searching...</p>`;

    try {
      const params = new URLSearchParams();

      if (keyword) params.append("keyword", keyword);
      if (city) params.append("city", city);
      if (category) params.append("category", category);

      params.append("_t", Date.now().toString());

      const response = await fetch(
        `${API_BASE}/api/google-search?${params.toString()}`
      );

      const data = await response.json();

      if (!response.ok) {
        resultContainer.innerHTML =
          `<p class="error-text">${data.message || "Search failed."}</p>`;
        return;
      }

      renderAttractions(data.results || []);
    } catch (error) {
      console.error("Search error:", error);

      resultContainer.innerHTML =
        `<p class="error-text">Cannot connect to backend.</p>`;
    }
  }

  function renderAttractions(attractions) {
    const bigIcon = document.querySelector(".big-search-icon");
    if (bigIcon) bigIcon.style.display = "none";

    if (!Array.isArray(attractions) || attractions.length === 0) {
      resultContainer.innerHTML = `<p class="empty-text">No attractions found.</p>`;
      return;
    }

    resultContainer.innerHTML = attractions.map(function (att) {
      const rating = att.avg_rating || att.google_rating || att.rating || "N/A";
      const city = att.city || "Taiwan";
      const category = att.categories || "Attraction";
      const address = att.formatted_address || att.description || "";
      const imageUrl = att.image_url || "images/default.jpg";

      return `
        <div class="search-result-card" onclick="goToAttraction(${att.att_id})">
          <img 
            class="search-result-img" 
            src="${imageUrl}" 
            alt="${att.att_name || "Attraction"}"
            onerror="this.onerror=null; this.src='images/default.jpg';"
          />
          <div class="search-result-info">
            <h4>${att.att_name || "Attraction"}</h4>
            <p>${address}</p>
            <div class="search-result-meta">
              <span><i class="fa-solid fa-location-dot"></i> ${city}</span>
              <span><i class="fa-solid fa-bars"></i> ${category}</span>
            </div>
            <div class="rating">★★★★★ <span>${rating}</span></div>
          </div>
        </div>
      `;
    }).join("");
  }

  function goToAttraction(attId) {
  if (!attId || attId === "null") {
    alert("This place was found from Google, but it was not saved to database yet. Please try again.");
    return;
  }

  window.location.href = `attraction.html?id=${attId}`;
}
</script>
</body>

</html>
