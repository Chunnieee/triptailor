<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TripTailor My Reviews</title>

  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="my_review.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>
  <div class="app-page">
    <div class="my-review-phone">

      <!-- Top Bar -->
      <header class="my-review-header">
        <button class="back-btn" onclick="history.back()">
          <i class="fa-solid fa-angle-left"></i>
        </button>

        <div class="profile-info">
          <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
          </div>

          <span id="review-user-name">User</span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="my-review-content">
        <h2>My Review</h2>

        <section class="my-review-card">
          <div class="my-review-card-header">
            <a href="attraction.html" class="my-review-place-name">
              台北市立動物園
            </a>

            <span class="my-review-date">2026/05/14</span>
          </div>

          <div class="my-review-stars">★★★★★</div>

          <p>
            “Great place for families and animal lovers. The zoo is spacious,
            clean, and has many different animals to see. The panda area was
            especially popular!”
          </p>
        </section>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <a href="home.html">
          <i class="fa-solid fa-house"></i>
        </a>

        <a href="search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <a href="favorites.html">
          <i class="fa-regular fa-star"></i>
        </a>

        <a href="profile.html" class="active">
          <i class="fa-regular fa-user"></i>
        </a>
      </nav>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const userId = localStorage.getItem("user_id");
      const userName = localStorage.getItem("user_name") || "User";

      document.getElementById("review-user-name").textContent = userName;

      if (!userId) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

    });
  </script>
</body>
</html>
