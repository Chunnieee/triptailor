<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TripTailor My Reviews</title>

  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="my_review.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>
  <div class="app-page">
    <div class="my-review-phone">

      <!-- Top Bar -->
      <header class="my-review-header">
        <button class="back-btn" onclick="history.back()">
          <i class="fa-solid fa-angle-left"></i>
        </button>

        <div class="profile-info">
          <div class="profile-icon">
            <i class="fa-regular fa-user"></i>
          </div>

          <span id="review-user-name">User</span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="my-review-content">
        <h2>My Review</h2>

        <div id="my-review-list">
            <p class="loading-text">Loading...</p>
        </div>
      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <a href="home.html">
          <i class="fa-solid fa-house"></i>
        </a>

        <a href="search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <a href="favorites.html">
          <i class="fa-regular fa-star"></i>
        </a>

        <a href="profile.html" class="active">
          <i class="fa-regular fa-user"></i>
        </a>
      </nav>

    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:4000";

    document.addEventListener("DOMContentLoaded", async function () {
        const userId = localStorage.getItem("user_id");
        const userName = localStorage.getItem("user_name") || "User";

        document.getElementById("review-user-name").textContent = userName;

        if (!userId) {
            alert("Please log in first.");
            window.location.href = "login.html";
            return;
        }

        await loadMyReviews(userId);
    });

    async function loadMyReviews(userId) {
        const list = document.getElementById("my-review-list");

        try {
        const response = await fetch(`${API_BASE}/api/users/${userId}/reviews`);
        const reviews = await response.json();

        if (!response.ok) {
            list.innerHTML = `<p class="empty-text">${reviews.message || "Failed to load reviews."}</p>`;
            return;
        }

        if (!Array.isArray(reviews) || reviews.length === 0) {
            list.innerHTML = `<p class="empty-text">No reviews yet.</p>`;
            return;
        }

        list.innerHTML = reviews.map((review) => {
            const stars =
                "★".repeat(Number(review.rating || 0)) +
                "☆".repeat(5 - Number(review.rating || 0));

            const placeName =
                review.att_name || review.attraction_name || "Attraction";

            const comment =
                review.comment || "";

            const date =
                review.created_at
                    ? new Date(review.created_at).toLocaleDateString("zh-TW")
                    : "";

            const attId =
                review.att_id || review.attraction_id || "";

            return `
                <section class="my-review-card">
                    <div class="my-review-card-header">
                        <a href="attraction.html?id=${attId}" class="my-review-place-name">
                            ${placeName}
                        </a>

                        <span class="my-review-date">${date}</span>
                    </div>

                    <div class="my-review-stars">${stars}</div>

                    <p>${comment}</p>
                </section>
            `;
        }).join("");

    } catch (error) {
      console.error(error);
      list.innerHTML = `<p class="empty-text">Cannot connect to backend.</p>`;
    }
  }
</script>
</body>
</html>
