<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TripTailor Edit Profile</title>

  <link rel="stylesheet" href="profile_edit.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>

  <div class="page">

    <div class="phone">

      <!-- 返回按鈕 -->
      <button class="back-btn" type="button">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <h1>Edit Profile</h1>

      <div class="edit-card">

        <!-- 頭像與姓名 -->
        <div class="top-row">

          <div class="avatar-area">
            <p>Profile Photo</p>

            <div class="avatar-box">
              <img id="avatar-preview" src="" alt="profile photo" />
              <i class="fa-regular fa-user" id="avatar-icon"></i>

              <label for="avatar-input" class="camera-btn">
                <i class="fa-solid fa-camera"></i>
              </label>

              <input
                type="file"
                id="avatar-input"
                accept="image/*"
                hidden
              />
            </div>
          </div>

          <div class="name-area">
            <label>Name</label>
            <input
              type="text"
              id="edit-name"
              placeholder="Name"
            />
          </div>

        </div>

        <!-- Email -->
        <div class="input-group">
          <label>Email</label>

          <div class="input-box">
            <input
              type="email"
              id="edit-email"
              placeholder="Email"
              readonly
            />
          </div>
        </div>

        <!-- Phone Number -->
        <div class="input-group">
          <label>Phone Number</label>

          <div class="input-box">
            <input
              type="tel"
              id="edit-phone"
              placeholder="Phone number"
            />
          </div>
        </div>

        <!-- New Password -->
        <div class="input-group">
          <label>New Password</label>
          <div class="input-box">
             <input type="password" id="edit-new-password" placeholder="New password" />
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="input-group">
         <label>Confirm New Password</label>
         <div class="input-box">
           <input type="password" id="edit-confirm-password" placeholder="Confirm new password" />
         </div>
        </div>
        
      <!-- Save button -->
      <button class="save-btn" type="button">
        Save
      </button>

      <!-- bottom navbar -->
      <nav class="bottom-nav">
        <a href="home.html">
          <i class="fa-solid fa-house"></i>
        </a>

        <a href="search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <a href="favorites.html">
          <i class="fa-regular fa-star"></i>
        </a>

        <a href="profile.html">
          <i class="fa-regular fa-user active"></i>
        </a>
      </nav>

    </div>

  </div>

  <script>
    const API_BASE = "http://localhost:4000";

    document.addEventListener("DOMContentLoaded", async function () {
      const backBtn = document.querySelector(".back-btn");
      const saveBtn = document.querySelector(".save-btn");

      const avatarInput = document.getElementById("avatar-input");
      const avatarPreview = document.getElementById("avatar-preview");
      const avatarIcon = document.getElementById("avatar-icon");

      const nameInput = document.getElementById("edit-name");
      const emailInput = document.getElementById("edit-email");
      const phoneInput = document.getElementById("edit-phone");
      const travelFreqInput = document.getElementById("edit-travel-freq");
      const cityInput = document.getElementById("edit-city");

      const userId = localStorage.getItem("user_id");

      // 沒登入就回 login
      if (!userId) {
        alert("Please log in first.");
        window.location.href = "login.html";
        return;
      }

      // 返回 profile
      backBtn.addEventListener("click", function () {
        window.location.href = "profile.html";
      });

      // 載入後端資料
      await loadProfile(userId);

      // 頭像預覽
      avatarInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (e) {
          avatarPreview.src = e.target.result;
          avatarPreview.style.display = "block";
          avatarIcon.style.display = "none";

          // 頭像目前先存在前端，因為後端沒有 avatar 欄位
          localStorage.setItem("user_avatar", e.target.result);
        };

        reader.readAsDataURL(file);
      });

      // Save
      saveBtn.addEventListener("click", async function () {
        await saveProfile(userId);
      });

      async function loadProfile(userId) {
        try {
          const response = await fetch(`${API_BASE}/api/users/${userId}`);
          const user = await response.json();

          if (!response.ok) {
            alert(user.message || "Failed to load profile.");
            return;
          }

          nameInput.value = user.name || "";
          emailInput.value = user.email || "";
          phoneInput.value = user.phone_number || "";

          localStorage.setItem("user_name", user.name || "");
          localStorage.setItem("user_email", user.email || "");
          localStorage.setItem("user_phone", user.phone_number || "");

          const savedAvatar = localStorage.getItem("user_avatar");

          if (savedAvatar) {
            avatarPreview.src = savedAvatar;
            avatarPreview.style.display = "block";
            avatarIcon.style.display = "none";
          }

        } catch (error) {
          console.error(error);
          alert("Cannot connect to backend.");
        }
      }

      async function saveProfile(userId) {
        const name = nameInput.value.trim();
        const phoneNumber = phoneInput.value.trim();


        if (!name) {
          alert("Name cannot be empty.");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/api/users/${userId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name: name,
              phone_number: phoneNumber,
            })
          });

          const data = await response.json();

          if (!response.ok) {
            alert(data.message || "Failed to update profile.");
            return;
          }

          localStorage.setItem("user_name", name);
          localStorage.setItem("user_phone", phoneNumber);


          alert("Profile updated!");
          window.location.href = "profile.html";

        } catch (error) {
          console.error(error);
          alert("Cannot connect to backend.");
        }
      }
    });
  </script>

</body>
</html>
